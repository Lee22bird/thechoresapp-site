<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Chores — chores get done, kids get paid</title>
<meta name="description" content="The Chores is a shared household chore and allowance app for families. One list the whole house can see.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --cream:#FAF7F0; --slate:#2F3A3D; --sage:#789685; --sage-deep:#4F6B5B;
    --gold:#E2B65A; --gold-deep:#7A5A14; --secondary:rgba(47,58,61,.72);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--cream); color:var(--slate); font-family:'Nunito',sans-serif;
         min-height:100svh; display:flex; flex-direction:column; align-items:center;
         text-align:center; padding:72px 24px 40px; }
  .icon { width:88px; height:88px; background:var(--sage); border-radius:26px;
          display:flex; align-items:center; justify-content:center;
          box-shadow:0 10px 26px rgba(120,150,133,.34); margin-bottom:26px;
          font-family:'Baloo 2',cursive; font-weight:800; font-size:48px; color:var(--cream); }
  h1 { font-family:'Baloo 2',cursive; font-weight:800; font-size:52px; letter-spacing:-.015em; line-height:1.05; }
  h1 .the { display:block; font-size:22px; font-weight:700; }
  h1 .o { display:inline-flex; width:.62em; height:.62em; background:var(--gold); border-radius:50%;
          align-items:center; justify-content:center; color:var(--cream); font-size:.34em; vertical-align:-.02em; }
  .tagline { margin:18px auto 0; max-width:340px; font-size:17px; font-weight:600; color:var(--secondary); line-height:1.55; }
  .soon { margin-top:30px; display:inline-block; background:#FBF1DD; color:var(--gold-deep);
          font-weight:800; font-size:14px; padding:12px 22px; border-radius:99px; }
  footer { margin-top:auto; padding-top:56px; font-size:13.5px; font-weight:700; color:var(--secondary); }
  footer a { color:var(--sage-deep); text-decoration:none; margin:0 8px; }
  footer a:hover { text-decoration:underline; }
</style>
</head>
<body>
  <div class="icon">C</div>
  <h1><span class="the">The</span>Ch<span class="o">✓</span>res</h1>
  <p class="tagline">One list the whole house can see. Chores get done, kids get paid, nobody has to nag.</p>
  <span class="soon">Coming soon to the App&nbsp;Store</span>
  <footer>
    <a href="privacy.html">Privacy</a> · <a href="support.html">Support</a>
    <div style="margin-top:10px">© 2026 The Chores</div>
  </footer>
</body>
</html>
