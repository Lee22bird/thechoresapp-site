<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset your password — The Chores</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root { --cream:#FAF7F0; --slate:#2F3A3D; --sage:#4F6B5B; --muted:rgba(47,58,61,.72); }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--cream); color:var(--slate); font-family:Nunito,sans-serif; }
  main { max-width:520px; margin:0 auto; padding:72px 24px; }
  h1 { font-family:'Baloo 2',cursive; font-size:38px; margin:0 0 10px; }
  p { color:var(--muted); font-weight:600; line-height:1.55; }
  form { background:#fff; border-radius:22px; padding:24px; margin-top:28px; box-shadow:0 2px 10px rgba(47,58,61,.06); }
  label { display:block; font-weight:800; margin-bottom:8px; }
  input { width:100%; border:1px solid rgba(47,58,61,.18); border-radius:12px; padding:14px; font:inherit; margin-bottom:16px; }
  button { border:0; border-radius:999px; background:var(--sage); color:#fff; padding:14px 22px; font:800 16px Nunito,sans-serif; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  #message { min-height:24px; margin-top:16px; font-weight:700; }
  a { color:var(--sage); font-weight:800; }
</style>
</head>
<body>
<main>
  <a href="index.html">← The Chores</a>
  <h1>Reset your password</h1>
  <p>Choose a new password for your The Chores account.</p>
  <form id="reset-form">
    <label for="password">New password</label>
    <input id="password" type="password" minlength="8" autocomplete="new-password" required placeholder="At least 8 characters">
    <label for="confirm">Confirm password</label>
    <input id="confirm" type="password" minlength="8" autocomplete="new-password" required placeholder="Type it again">
    <button id="submit" type="submit" disabled>Update password</button>
    <p id="message" role="status">Checking your reset link…</p>
  </form>
</main>
<script>
  const client = supabase.createClient(
    'https://fkxgrytykqjwakjsplsh.supabase.co',
    'sb_publishable_pGIkwuhnDXqxkigD7Y1VHA_yHwyXlDz',
    { auth: { detectSessionInUrl: false, persistSession: false } }
  );
  const form = document.getElementById('reset-form');
  const message = document.getElementById('message');
  const submit = document.getElementById('submit');

  // The reset is started on the phone but finished here in the browser, so we
  // cannot use the PKCE code exchange (its verifier lives on the phone). Instead
  // we verify the one-time token hash from the email link — that works from any
  // device. We still accept a fragment session or a code as fallbacks.
  async function establishSession() {
    const query = new URLSearchParams(window.location.search);
    const hash = new URLSearchParams(window.location.hash.replace(/^#/, ''));
    const tokenHash = query.get('token_hash') || hash.get('token_hash');
    const type = query.get('type') || hash.get('type') || 'recovery';
    const accessToken = hash.get('access_token');
    const refreshToken = hash.get('refresh_token');
    const code = query.get('code');

    try {
      if (tokenHash) {
        const { error } = await client.auth.verifyOtp({ type, token_hash: tokenHash });
        if (error) throw error;
      } else if (accessToken && refreshToken) {
        const { error } = await client.auth.setSession({ access_token: accessToken, refresh_token: refreshToken });
        if (error) throw error;
      } else if (code) {
        const { error } = await client.auth.exchangeCodeForSession(code);
        if (error) throw error;
      } else {
        message.textContent = 'Open this page from the link in your password-reset email.';
        return;
      }
    } catch (e) {
      message.textContent = 'This reset link has expired or was already used — request a new one from the app.';
      return;
    }

    const { data } = await client.auth.getSession();
    if (data.session) {
      message.textContent = 'Choose your new password below.';
      submit.disabled = false;
    } else {
      message.textContent = 'Open this page from the newest password-reset email.';
    }
  }
  establishSession();

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    const password = document.getElementById('password').value;
    const confirm = document.getElementById('confirm').value;
    if (password !== confirm) { message.textContent = 'The passwords do not match.'; return; }
    submit.disabled = true;
    const { error } = await client.auth.updateUser({ password });
    if (error) {
      message.textContent = error.message;
      submit.disabled = false;
    } else {
      message.textContent = 'Password updated! Head back to the app and sign in.';
      form.reset();
    }
  });
</script>
</body>
</html>
